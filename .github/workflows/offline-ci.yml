name: Offline Node 22 checks

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/offline-ci.yml"
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
  pull_request:
    paths:
      - ".github/workflows/offline-ci.yml"
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source without persistent credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run tests and offline CLIs with only loopback networking
        shell: bash
        run: |
          node_bin="$(command -v node)"
          sudo unshare --net -- bash -eu -c '
            ip link set lo up
            test -z "$(ip route show default)"
            test -z "$(ip -6 route show default)"
            echo "Network namespace: loopback only; external egress unavailable"
            exec env -i PATH=/usr/bin:/bin "$1" scripts/check-offline.mjs
          ' _ "$node_bin"
